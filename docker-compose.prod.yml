version: "3.8"

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ${ECR_REGISTRY}/saleor:${IMAGE_TAG}
    expose:
      - "8000"
    env_file:
      - .env.prod
    depends_on:
      - redis
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn saleor.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class gthread
      --threads 2
      "
    restart: unless-stopped

  worker:
    image: ${ECR_REGISTRY}/saleor:${IMAGE_TAG}
    command: celery -A saleor worker -l warning --concurrency 4
    env_file:
      - .env.prod
    depends_on:
      - redis
    restart: unless-stopped

  beat:
    image: ${ECR_REGISTRY}/saleor:${IMAGE_TAG}
    command: celery -A saleor beat -l warning
    env_file:
      - .env.prod
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  redis_data: