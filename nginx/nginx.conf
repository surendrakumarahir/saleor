events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 100M;

    upstream saleor_api {
        server api:8000;
    }

    upstream saleor_storefront {
        server saleor-storefront:3000;
    }

    upstream saleor_dashboard {
        server saleor-dashboard:80;
    }

    # 1. HTTP -> HTTPS Redirect
    server {
        listen 80;
        server_name api.easytopick.in easytopick.in www.easytopick.in dashboard.easytopick.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Saleor API (api.easytopick.in)
    server {
        listen 443 ssl;
        server_name api.easytopick.in;

        ssl_certificate /etc/letsencrypt/live/api.easytopick.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.easytopick.in/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location / {
            proxy_pass http://saleor_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }

    # 3. Next.js Storefront (easytopick.in)
    server {
        listen 443 ssl;
        server_name easytopick.in www.easytopick.in;

        ssl_certificate /etc/letsencrypt/live/easytopick.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/easytopick.in/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://saleor_storefront;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # 4. Saleor Dashboard (dashboard.easytopick.in)
    server {
        listen 443 ssl;
        server_name dashboard.easytopick.in;

        ssl_certificate /etc/letsencrypt/live/easytopick.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/easytopick.in/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://saleor_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
