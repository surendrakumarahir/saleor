services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://easypick:easypick786@db:5432/easypickbook
      - CELERY_BROKER_URL=redis://redis:6379/0
      - SECRET_KEY=your-dev-secret-key-change-in-prod
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DEFAULT_FROM_EMAIL=noreply@example.com
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./media:/app/media
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A saleor worker -l info
    environment:
      - DATABASE_URL=postgres://easypick:easypick786@db:5432/easypickbook
      - CELERY_BROKER_URL=redis://redis:6379/0
      - SECRET_KEY=your-dev-secret-key-change-in-prod
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: postgres:15-alpine
    ports:
      - "5431:5432" 
    environment:
      POSTGRES_DB: easypickbook
      POSTGRES_USER: easypick
      POSTGRES_PASSWORD: easypick786
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easypick -d easypickbook"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: